<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva de Mesa - Restaurante</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        <h1>Reserva tu Mesa</h1>
        <form action="reservar.php" method="POST">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="apellido">Apellido (solo el primer apellido):</label>
            <input type="text" id="apellido" name="apellido" required>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" required>

            <label for="telefono">Teléfono de contacto:</label>
            <input type="text" id="telefono" name="telefono" required>

            <label for="fecha_reserva">Fecha de la reserva:</label>
            <input type="date" id="fecha_reserva" name="fecha_reserva" required>

            <label for="num_personas">Número de personas:</label>
            <input type="number" id="num_personas" name="num_personas" required>

            <label for="turno">Turno de reserva:</label>
            <select id="turno" name="turno" required>
                <option value="Comida">Comida</option>
                <option value="Cena">Cena</option>
            </select>

            <button type="submit">Enviar Reserva</button>
        </form>
        <p><a href="listas.php">Ver reservas existentes</a></p>
    </div>
</body>
</html>
